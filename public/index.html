<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<div id="entries"></div>
<script>
const container = document.getElementById("entries");

function connect() {
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${protocol}//${location.host}/ws`;
    const ws = new WebSocket(wsUrl);

    ws.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            
            const div = document.createElement("div");
            div.style.marginBottom = "20px";
            div.style.whiteSpace = "pre-wrap";
            div.textContent = 
`username of the guy: ${data.username || "Unknown"}
Brainrot Name: ${data.brainrotName || "Unknown"}
How much it generates: ${data.generation || "N/A"}
What mutation it is: ${data.mutation || "Normal"}`;

            container.appendChild(div);

            setTimeout(() => {
                div.remove();
            }, 15000);
        } catch (e) {
            console.error(e);
        }
    };

    ws.onclose = () => {
        setTimeout(connect, 2000);
    };
}

connect();
</script>
</body>
</html>
